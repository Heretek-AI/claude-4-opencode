name: E2E

# Drives the real opencode binary with real plugins from the marketplaces pinned in
# e2e/targets.lock.json. A scripted stub plays the model, so this needs no secrets and
# gives the same result on every run, including on pull requests from forks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripted:
    name: opencode ${{ matrix.opencode }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The pinned version gates merges. `latest` shows upstream changes early without blocking.
        opencode: ["2.0.26", "latest"]
    continue-on-error: ${{ matrix.opencode == 'latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install opencode
        run: |
          npm install --global "@opencode/cli@${{ matrix.opencode }}"
          opencode --version
      - name: Restore marketplace checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .e2e/cache
          key: e2e-cache-${{ hashFiles('e2e/targets.lock.json') }}
      - run: bun install --frozen-lockfile
      - name: Run end-to-end tests
        run: bun run e2e
      - name: Compatibility report
        if: always()
        run: |
          mkdir -p .e2e/report
          bun run --silent e2e:report > .e2e/report/COMPATIBILITY.md
          cat .e2e/report/COMPATIBILITY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: e2e-report-opencode-${{ matrix.opencode }}
          path: .e2e/report
