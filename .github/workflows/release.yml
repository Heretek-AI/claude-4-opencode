name: Release

# Publishes to npm via OIDC trusted publishing (no long-lived tokens).
# First publish is done locally; afterwards, pushing a `v*` tag releases.
# npmjs.com → package Settings → Trusted Publisher must list:
#   org/user: Heretek-AI, repo: claude-4-opencode, workflow: release.yml

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # Required for npm OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # Provenance is automatic with trusted publishing; no --provenance flag needed.
      # No NODE_AUTH_TOKEN: authentication comes from the OIDC id-token.
      - run: npm publish --access public
