name: Nightly

# Two checks that are too slow or too variable for every pull request:
#   live      a real model drives the same plugins (needs the OPENCODE_API_KEY secret)
#   external  every plugin that lives outside its marketplace repository is fetched and loaded

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Model for the live tier, as provider/model or a bare model id"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      C4O_LIVE_MODEL: ${{ inputs.model || vars.E2E_LIVE_MODEL || 'muse-spark-1.3-contributor-free' }}
    steps:
      - name: Check for a provider key
        id: key
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::notice::The OPENCODE_API_KEY secret is not set, so the live tier was skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.key.outputs.present == 'true'
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 24
      - name: Install opencode
        if: steps.key.outputs.present == 'true'
        run: |
          npm install --global @opencode/cli@2.0.26
          opencode --version
      - name: Run the live tier
        if: steps.key.outputs.present == 'true'
        run: |
          bun install --frozen-lockfile
          bun run build
          bun test ./e2e/live --timeout 1200000 --reporter=junit --reporter-outfile=.e2e/report/junit-live.xml
      - uses: actions/upload-artifact@v7
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: live-report
          path: .e2e/report

  external:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install opencode
        run: npm install --global @opencode/cli@2.0.26
      - run: bun install --frozen-lockfile
      - name: Fetch and load every external plugin
        run: |
          bun run build
          bun test ./e2e/conformance.test.ts --timeout 2400000
        env:
          C4O_E2E_FULL: "1"
